name: Desplegar backend (Supabase)

# Instala la base de datos, el servidor de TMDB y la configuración de cuentas en Supabase,
# y genera js/config.js para que la app use modo "cuentas".
# Necesita estos secretos en Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, TMDB_API_KEY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: write

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Revisar secretos
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$TMDB_API_KEY" ] && missing="$missing TMDB_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular proyecto
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Crear / actualizar tablas
        run: |
          # La contraseña llega por la variable SUPABASE_DB_PASSWORD.
          # Las versiones nuevas de la CLI usan --remote; las anteriores, --linked.
          if supabase db push --help | grep -q -- '--remote'; then
            supabase db push --remote --include-all --yes
          else
            supabase db push --linked --include-all --yes
          fi

      - name: Guardar la clave de TMDB como secreto
        run: supabase secrets set --project-ref "$PROJECT_REF" TMDB_API_KEY="$TMDB_API_KEY"

      - name: Publicar el servidor de TMDB
        run: supabase functions deploy tmdb --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Configurar cuentas (dirección del sitio, sin mail de confirmación)
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          SITE="https://${OWNER}.github.io/${REPO}/"
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\":\"$SITE\",\"uri_allow_list\":\"$SITE**\",\"mailer_autoconfirm\":true}" > /dev/null
          echo "Sitio: $SITE"

      - name: Generar js/config.js
        run: |
          KEYS=$(curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          ANON=$(echo "$KEYS" | jq -r '([.[] | select(.name=="anon")] + [.[] | select(.type=="publishable")])[0].api_key // empty')
          if [ -z "$ANON" ]; then echo "::error::No encontré la clave pública (anon) del proyecto"; exit 1; fi
          cat > js/config.js <<EOF
          // Generado automáticamente por .github/workflows/backend.yml. Estos datos son públicos.
          window.MICINE_CONFIG = {
            supabaseUrl: "https://$PROJECT_REF.supabase.co",
            supabaseAnonKey: "$ANON"
          };
          EOF
          sed -i 's/^          //' js/config.js
          cat js/config.js

      - name: Subir config.js
        run: |
          if git diff --quiet -- js/config.js; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add js/config.js
          git commit -m "Conectar la app con Supabase"
          git push
