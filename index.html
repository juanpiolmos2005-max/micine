<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiCine — pelis y series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f6f1ea,#141017);--panel:light-dark(#fff,#1e1823);--line:light-dark(#e3d9cc,#2f2635);
--ink:light-dark(#1b1420,#f3ecf5);--mute:light-dark(#6c6070,#a597ab);--acc:#ff4d3d;--acc2:light-dark(#b8261a,#ff7a6d);--ok:#2fbf71}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Big Shoulders Display",Impact,sans-serif;line-height:1.05;margin:0;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
img{display:block;max-width:100%}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px max(3vw,14px)}
.logo{font-size:30px;display:flex;align-items:center;gap:8px}
.logo i{width:30px;height:22px;background:var(--acc);border-radius:4px;position:relative}
.logo i:after{content:"";position:absolute;inset:5px 9px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:0;width:0;height:0;inset:5px auto auto 11px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:10px 14px;border-radius:999px;font-weight:600;min-height:44px}
nav button[aria-current=true]{background:var(--ink);color:var(--bg)}
nav b{font-size:12px;background:var(--acc);color:#fff;border-radius:99px;padding:1px 7px;margin-left:4px}
.gear{margin-left:auto;background:none;border:1px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:18px}
main{max-width:1280px;margin:auto;padding:22px max(3vw,14px) 80px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 18px}
.search{flex:1 1 280px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.search input{flex:1;border:0;background:none;padding:12px 14px;font-size:16px;outline:0}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;min-height:38px}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:14px}
.chips button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
label.chk input{width:18px;height:18px;accent-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}}
.card{position:relative}
.poster{display:block;width:100%;aspect-ratio:2/3;border:0;padding:0;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#3a2b45,#1b1420);box-shadow:0 6px 18px #0003;transition:transform .2s}
.poster:hover{transform:translateY(-3px)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster span{display:grid;place-items:center;height:100%;padding:10px;color:#f3ecf5;font-family:"Big Shoulders Display";font-size:20px;text-align:center}
.seen .poster img{filter:saturate(.35) brightness(.7)}
.tick{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:#0008;color:#fff;font-weight:900;font-size:17px;display:grid;place-items:center;box-shadow:0 2px 8px #0006}
.seen .tick{background:var(--ok);border-color:var(--ok)}
.wantmark{position:absolute;top:8px;left:8px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.meta{padding-top:8px}
.meta b{display:block;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta small{color:var(--mute);font-size:13px}
.more{display:block;margin:30px auto 0;padding:12px 26px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.hello{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:30px;align-items:center;margin-top:20px}
@media(max-width:760px){.hello{grid-template-columns:1fr}}
.hello h1{font-size:clamp(44px,7vw,78px)}
.hello ol{padding-left:20px}
.hello li{margin:6px 0}
.reel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;transform:rotate(-4deg)}
.reel div{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 10px 30px #0004}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.field{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.field input{flex:1 1 240px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.btn{border:0;background:var(--acc);color:#fff;font-weight:700;border-radius:10px;padding:12px 18px;min-height:44px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.on{background:var(--ok)}
.err{color:var(--acc2);font-weight:600}
.muted{color:var(--mute)}
h2.sec{font-size:clamp(30px,4vw,44px);margin:6px 0 4px}
.sagas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.saga{text-align:left;border:0;border-radius:16px;padding:18px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 8px 24px #0002}
.saga h3{font-size:32px}
.saga small{opacity:.85}
.prog{height:8px;border-radius:9px;background:#fff4;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:#fff}
.order{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:44px 56px minmax(0,1fr) 46px;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.row .num{font-family:"Big Shoulders Display";font-size:30px;text-align:center;color:var(--mute)}
.row .poster{border-radius:6px;box-shadow:none}
.row .poster span{font-size:11px;padding:3px}
.row b{display:block;line-height:1.25}
.row small{color:var(--mute)}
.row .tick{position:static;border-color:var(--line);background:none;color:var(--mute)}
.row.seen{opacity:.7}.row.seen .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.row.next{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--acc);color:#fff;margin-left:6px;vertical-align:2px}
.note{border-left:4px solid var(--acc);padding:8px 14px;background:var(--panel);border-radius:0 10px 10px 0;margin:10px 0}
.back{background:none;border:0;color:var(--mute);font-weight:600;padding:8px 0;min-height:44px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.stat b{font-family:"Big Shoulders Display";font-size:42px;display:block;line-height:1}
.hrow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.hrow .card{flex:0 0 140px;scroll-snap-align:start}
#modal{position:fixed;inset:0;z-index:50;background:#000a;display:none;overflow-y:auto;padding:4vh 12px}
#modal.open{display:block}
.sheet{max-width:960px;margin:auto;background:var(--bg);border-radius:18px;overflow:hidden;position:relative}
.hero{position:relative;min-height:230px;background:#1b1420 center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg))}
.close{position:absolute;top:12px;right:12px;z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:20px}
.dbody{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:0 24px 28px;margin-top:-120px;position:relative;z-index:2}
@media(max-width:640px){.dbody{grid-template-columns:110px minmax(0,1fr);gap:14px;padding:0 14px 22px;margin-top:-80px}}
.dbody h2{font-size:clamp(30px,5vw,48px)}
.facts{color:var(--mute);margin:6px 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.provs{display:flex;flex-wrap:wrap;gap:8px}
.provs img{width:42px;height:42px;border-radius:10px}
.full{grid-column:1/-1}
.cast{display:flex;flex-wrap:wrap;gap:6px}
.cast span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px}
.empty{text-align:center;padding:50px 10px;color:var(--mute)}
.spin{text-align:center;padding:40px;color:var(--mute)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:60}
#toast.show{transform:translateX(-50%)}
textarea{width:100%;min-height:120px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px;font:13px/1.4 ui-monospace,monospace}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const KEY='micine.v1';
let S={key:'',region:'AR',lang:'es-MX',watched:{},want:{},cache:{},order:{},series:{}};

/* ===================== TMDB ===================== */
async function api(path,params={},key=S.key){
  const u=new URL('https://api.themoviedb.org/3/'+path);
  u.searchParams.set('language',S.lang);
  for(const[k,v]of Object.entries(params))if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,v);
  const h={accept:'application/json'};
  if(/^[a-f0-9]{32}$/i.test(key.trim()))u.searchParams.set('api_key',key.trim());else h.Authorization='Bearer '+key.trim();
  const r=await fetch(u,{headers:h});
  if(r.status===401)throw new Error('La clave de TMDB no es válida.');
  if(!r.ok)throw new Error('TMDB respondió '+r.status);
  return r.json();
}
function norm(r,type){
  const t=r.media_type||type;
  const n={id:r.id,type:t,title:r.title||r.name||'Sin título',year:(r.release_date||r.first_air_date||'').slice(0,4),poster:r.poster_path||null,vote:r.vote_average||0};
  const k=t+':'+r.id;REG[k]=Object.assign(REG[k]||{},n);return n;
}
const kOf=n=>n.type+':'+n.id;

/* ===================== TARJETAS ===================== */
function card(n){
  const k=kOf(n);REG[k]=Object.assign(REG[k]||{},n);
  const w=S.watched[k];
  return `<article class="card${w?' seen':''}" data-k="${k}">
  <button class="poster" data-open="${k}" aria-label="${esc(n.title)}">${n.poster?`<img loading="lazy" src="${img(n.poster)}" alt="">`:`<span>${esc(n.title)}</span>`}</button>
  ${S.want[k]&&!w?'<span class="wantmark">Quiero ver</span>':''}
  <button class="tick" data-tick="${k}" aria-pressed="${!!w}" title="${w?'Vista':'Marcar como vista'}">✓</button>
  <div class="meta"><b>${esc(n.title)}</b><small>${n.year||'—'} · ${n.type==='tv'?'Serie':'Película'}${n.vote?` · ★ ${n.vote.toFixed(1)}`:''}</small></div></article>`;
}
function toggleWatched(k){
  const n=REG[k]||S.want[k];if(!n)return;
  if(S.watched[k]){delete S.watched[k];toast('Quitada de vistas')}
  else{S.watched[k]={id:n.id,type:n.type,title:n.title,year:n.year,poster:n.poster,vote:n.vote,at:Date.now()};delete S.want[k];toast('✓ '+n.title+' marcada como vista')}
  recsCache=null;save();refresh();
}
function toggleWant(k){
  const n=REG[k];if(!n)return;
  if(S.want[k])delete S.want[k];else S.want[k]={id:n.id,type:n.type,title:n.title,year:n.year,poster:n.poster,vote:n.vote,at:Date.now()};
  save();refresh();
}
function refresh(){
  $('#cnt').textContent=Object.keys(S.watched).length;
  if(view==='explorar'||view==='parati'){document.querySelectorAll('.card[data-k]').forEach(el=>{const w=!!S.watched[el.dataset.k];el.classList.toggle('seen',w);el.querySelector('.tick').setAttribute('aria-pressed',w);const wm=el.querySelector('.wantmark');if(w&&wm)wm.remove()});if(ex.hide)renderExplore()}
  else render();
  if(openKey)openDetail(openKey,true);
}

/* ===================== VISTAS ===================== */
let view='explorar';
const app=$('#app');
function go(v){location.hash=v}
function route(){
  const h=location.hash.slice(1);
  view=['explorar','sagas','parati','mia'].includes(h)?h:(h.startsWith('saga-')?'sagas':'explorar');
  sagaOpen=h.startsWith('saga-')?h.slice(5):null;
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view));
  render();
}
function render(){
  $('#cnt').textContent=Object.keys(S.watched).length;
  if(!S.key)return renderHello();
  ({explorar:renderExplore,sagas:renderSagas,parati:renderRecs,mia:renderMine})[view]();
}

/* ---------- Explorar ---------- */
const ex={type:'movie',mode:'trending',genre:null,q:'',page:1,items:[],total:1,hide:false,loading:false};
let genres={};
async function loadGenres(){if(genres[ex.type])return;try{genres[ex.type]=(await api(`genre/${ex.type}/list`)).genres}catch(e){genres[ex.type]=[]}}
async function fetchExplore(reset){
  if(reset){ex.page=1;ex.items=[]}
  ex.loading=true;renderExplore();
  try{
    let d;
    if(ex.q)d=await api(ex.type==='all'?'search/multi':`search/${ex.type}`,{query:ex.q,page:ex.page});
    else if(ex.genre)d=await api(`discover/${ex.type}`,{with_genres:ex.genre,sort_by:'popularity.desc','vote_count.gte':50,page:ex.page});
    else if(ex.mode==='top')d=await api(`${ex.type}/top_rated`,{page:ex.page});
    else if(ex.mode==='popular')d=await api(`${ex.type}/popular`,{page:ex.page});
    else if(ex.mode==='now')d=await api(ex.type==='tv'?'tv/on_the_air':'movie/now_playing',{page:ex.page,region:S.region});
    else d=await api(`trending/${ex.type}/week`,{page:ex.page});
    const res=d.results.filter(r=>!r.media_type||r.media_type==='movie'||r.media_type==='tv').map(r=>norm(r,ex.type));
    const seen=new Set(ex.items.map(kOf));ex.items.push(...res.filter(r=>!seen.has(kOf(r))));ex.total=d.total_pages||1;ex.err='';
  }catch(e){ex.err=e.message}
  ex.loading=false;renderExplore();
}
function renderExplore(){
  if(!app.querySelector('#exwrap')){
    app.innerHTML=`<div id="exwrap"><h2 class="sec">Explorar</h2>
    <form class="tools" id="sform"><div class="search"><input id="q" type="search" placeholder="Buscar cualquier película o serie…" value="${esc(ex.q)}"></div>
    <div class="seg" id="tseg"><button type="button" data-t="movie">Películas</button><button type="button" data-t="tv">Series</button></div>
    <label class="chk"><input type="checkbox" id="hide"> Ocultar las que ya vi</label></form>
    <div class="chips" id="modes"></div><div class="chips" id="gchips"></div><div id="exres" style="margin-top:14px"></div></div>`;
    $('#sform').onsubmit=e=>{e.preventDefault();ex.q=$('#q').value.trim();ex.genre=null;fetchExplore(true)};
    $('#q').oninput=e=>{if(!e.target.value&&ex.q){ex.q='';fetchExplore(true)}};
    $('#tseg').onclick=async e=>{const t=e.target.dataset.t;if(!t||t===ex.type)return;ex.type=t;ex.genre=null;await loadGenres();fetchExplore(true)};
    $('#hide').onchange=e=>{ex.hide=e.target.checked;renderExplore()};
    loadGenres().then(()=>{if(!ex.items.length&&!ex.loading)fetchExplore(true);else renderExplore()});
  }
  $('#hide').checked=ex.hide;
  document.querySelectorAll('#tseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===ex.type));
  const modes=[['trending','Tendencias'],['popular','Populares'],['top','Mejor puntuadas'],['now',ex.type==='tv'?'En emisión':'En cines']];
  $('#modes').innerHTML=ex.q?`<button aria-pressed="true" data-clear>Resultados para “${esc(ex.q)}” ✕</button>`:modes.map(m=>`<button data-mode="${m[0]}" aria-pressed="${!ex.genre&&ex.mode===m[0]}">${m[1]}</button>`).join('');
  $('#gchips').innerHTML=ex.q?'':(genres[ex.type]||[]).map(g=>`<button data-genre="${g.id}" aria-pressed="${ex.genre==g.id}">${esc(g.name)}</button>`).join('');
  $('#modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.clear!==undefined){ex.q='';$('#q').value=''}else{ex.mode=b.dataset.mode;ex.genre=null}fetchExplore(true)};
  $('#gchips').onclick=e=>{const b=e.target.closest('button');if(!b)return;ex.genre=ex.genre==b.dataset.genre?null:+b.dataset.genre;fetchExplore(true)};
  const list=ex.hide?ex.items.filter(n=>!S.watched[kOf(n)]):ex.items;
  $('#exres').innerHTML=(ex.err?`<p class="err">${esc(ex.err)}</p>`:'')+
    (list.length?`<div class="grid">${list.map(card).join('')}</div>`:(ex.loading?'':`<p class="empty">No encontré nada${ex.q?' con esa búsqueda':''}.</p>`))+
    (ex.loading?'<p class="spin">Cargando…</p>':(ex.page<ex.total&&ex.items.length?'<button class="more" id="more">Cargar más</button>':''));
  const m=$('#more');if(m)m.onclick=()=>{ex.page++;fetchExplore(false)};
}

/* ---------- Sagas ---------- */
let sagaOpen=null;
const ckey=it=>it[0]+'|'+it[1]+'|'+it[2];
async function resolveItem(it){
  const ck=ckey(it);if(S.cache[ck])return S.cache[ck];
  const type=it[0]==='t'?'tv':'movie';
  const yk=type==='tv'?'first_air_date_year':'primary_release_year';
  try{
    let d=await api(`search/${type}`,{query:it[1],[yk]:it[2]});
    if(!d.results.length)d=await api(`search/${type}`,{query:it[1]});
    const r=d.results[0];if(!r)return null;
    const n=norm(r,type);S.cache[ck]={id:n.id,type,title:n.title,year:n.year||String(it[2]),poster:n.poster,vote:n.vote};return S.cache[ck];
  }catch(e){return null}
}
async function resolveSaga(s){
  const todo=s.items.filter(it=>!S.cache[ckey(it)]);
  for(let i=0;i<todo.length;i+=6)await Promise.all(todo.slice(i,i+6).map(resolveItem));
  if(todo.length)save();
}
function sagaList(s,mode,withSeries){
  let arr=s.items.map((it,i)=>({it,i,n:S.cache[ckey(it)]}));
  if(!withSeries)arr=arr.filter(x=>x.it[0]==='m');
  if(mode==='estreno')arr.sort((a,b)=>a.it[3].localeCompare(b.it[3]));
  return arr;
}
const isW=x=>x.n&&S.watched[x.n.type+':'+x.n.id];
function renderSagas(){
  if(sagaOpen&&sagaOpen.startsWith('col'))return renderCollection(+sagaOpen.slice(3));
  const s=SAGAS.find(x=>x.id===sagaOpen);
  if(s)return renderSaga(s);
  app.innerHTML=`<h2 class="sec">Sagas y universos</h2><p class="muted">Elegí una saga para verla en orden, tildar lo que ya viste y saber qué sigue.</p>
  <div class="sagas" style="margin-top:16px">${SAGAS.map(s=>{const l=sagaList(s,'crono',S.series[s.id]!==false),w=l.filter(isW).length;
   return `<button class="saga" data-saga="${s.id}" style="--c1:${s.c1};--c2:${s.c2}"><h3>${esc(s.name)}</h3><div><small>${w} de ${l.length} vistas</small><div class="prog"><i style="width:${l.length?w/l.length*100:0}%"></i></div></div></button>`}).join('')}</div>
  <h2 class="sec" style="margin-top:36px;font-size:30px">Buscar otra saga</h2>
  <p class="muted">TMDB agrupa miles de colecciones: Shrek, Rocky, Bond, Batman de Nolan, Volver al futuro…</p>
  <form class="tools" id="colform"><div class="search"><input id="colq" placeholder="Ej: Rocky, James Bond, Matrix…"></div><button class="btn">Buscar</button></form><div id="colres"></div>`;
  $('#colform').onsubmit=async e=>{e.preventDefault();const q=$('#colq').value.trim();if(!q)return;$('#colres').innerHTML='<p class="spin">Buscando…</p>';
    try{const d=await api('search/collection',{query:q});
      $('#colres').innerHTML=d.results.length?`<div class="grid">${d.results.slice(0,18).map(c=>`<div class="card"><button class="poster" data-col="${c.id}">${c.poster_path?`<img loading="lazy" src="${img(c.poster_path)}" alt="">`:`<span>${esc(c.name)}</span>`}</button><div class="meta"><b>${esc(c.name)}</b></div></div>`).join('')}</div>`:'<p class="empty">No encontré colecciones con ese nombre.</p>';
    }catch(er){$('#colres').innerHTML=`<p class="err">${esc(er.message)}</p>`}};
}
async function renderSaga(s){
  const mode=S.order[s.id]||'crono',ws=S.series[s.id]!==false,hasTv=s.items.some(i=>i[0]==='t');
  const draw=()=>{
    const l=sagaList(s,mode,ws),nextI=l.findIndex(x=>x.n&&!isW(x)),w=l.filter(isW).length;
    app.innerHTML=`<button class="back" data-go="sagas">← Todas las sagas</button>
    <h2 class="sec">${esc(s.name)}</h2><p class="muted">${w} de ${l.length} vistas</p>
    <div class="tools"><div class="seg" id="oseg"><button data-o="crono" aria-pressed="${mode==='crono'}">Cronológico</button><button data-o="estreno" aria-pressed="${mode==='estreno'}">Orden de estreno</button></div>
    ${hasTv?`<label class="chk"><input type="checkbox" id="wser" ${ws?'checked':''}> Incluir series</label>`:''}</div>
    <p class="note">${esc(s.note)}</p>
    <ol class="order">${l.map((x,i)=>{const n=x.n,k=n&&n.type+':'+n.id,seen=n&&S.watched[k];if(n)REG[k]=Object.assign(REG[k]||{},n);
      return `<li class="row${seen?' seen':''}${i===nextI?' next':''}"><span class="num">${i+1}</span>
      <button class="poster" ${n?`data-open="${k}"`:''} aria-label="${esc(x.it[1])}">${n&&n.poster?`<img loading="lazy" src="${img(n.poster,'w154')}" alt="">`:`<span>${esc(x.it[1])}</span>`}</button>
      <div><b>${esc(n?n.title:x.it[1])}${i===nextI?'<span class="tag">Sigue</span>':''}</b><small>${x.it[2]} · ${x.it[0]==='t'?'Serie':'Película'}${x.it[4]?' · '+esc(x.it[4]):''}${n?'':' · cargando…'}</small></div>
      ${n?`<button class="tick" data-tick="${k}" aria-pressed="${!!seen}" title="Marcar como vista">✓</button>`:'<span></span>'}</li>`}).join('')}</ol>`;
    $('#oseg').onclick=e=>{const o=e.target.dataset.o;if(o){S.order[s.id]=o;save();renderSaga(s)}};
    const c=$('#wser');if(c)c.onchange=()=>{S.series[s.id]=c.checked;save();renderSaga(s)};
  };
  draw();
  if(s.items.some(it=>!S.cache[ckey(it)])){await resolveSaga(s);if(view==='sagas'&&sagaOpen===s.id)draw()}
}
async function renderCollection(id){
  app.innerHTML='<p class="spin">Cargando saga…</p>';
  try{const c=await api('collection/'+id);
    const parts=c.parts.filter(p=>p.release_date).sort((a,b)=>a.release_date.localeCompare(b.release_date)).concat(c.parts.filter(p=>!p.release_date)).map(p=>norm(p,'movie'));
    const nextI=parts.findIndex(n=>!S.watched[kOf(n)]);
    app.innerHTML=`<button class="back" data-go="sagas">← Todas las sagas</button><h2 class="sec">${esc(c.name)}</h2>
    <p class="muted">${parts.filter(n=>S.watched[kOf(n)]).length} de ${parts.length} vistas · orden de estreno</p>${c.overview?`<p class="note">${esc(c.overview)}</p>`:''}
    <ol class="order">${parts.map((n,i)=>{const k=kOf(n),seen=S.watched[k];return `<li class="row${seen?' seen':''}${i===nextI?' next':''}"><span class="num">${i+1}</span><button class="poster" data-open="${k}">${n.poster?`<img loading="lazy" src="${img(n.poster,'w154')}" alt="">`:`<span>${esc(n.title)}</span>`}</button><div><b>${esc(n.title)}${i===nextI?'<span class="tag">Sigue</span>':''}</b><small>${n.year||'Próximamente'}</small></div><button class="tick" data-tick="${k}" aria-pressed="${!!seen}">✓</button></li>`}).join('')}</ol>`;
  }catch(e){app.innerHTML=`<button class="back" data-go="sagas">← Volver</button><p class="err">${esc(e.message)}</p>`}
}

/* ---------- Para vos ---------- */
let recsCache=null;
async function renderRecs(){
  const W=Object.values(S.watched);
  if(!W.length){app.innerHTML=`<h2 class="sec">Para vos</h2><p class="empty">Tildá algunas pelis o series que ya viste y acá te armo recomendaciones a tu medida.<br><br><button class="btn" data-go="explorar">Ir a Explorar</button></p>`;return}
  app.innerHTML=`<h2 class="sec">Para vos</h2><p class="muted">Basado en lo último que marcaste como visto.</p><div id="recbody"><p class="spin">Pensando qué te puede gustar…</p></div>`;
  if(!recsCache){
    const base=W.sort((a,b)=>b.at-a.at).slice(0,12),score={};
    await Promise.all(base.map(async(b,bi)=>{try{const d=await api(`${b.type}/${b.id}/recommendations`);
      d.results.forEach((r,ri)=>{const n=norm(r,b.type),k=kOf(n);if(S.watched[k])return;const sc=score[k]||(score[k]={n,s:0,from:[]});sc.s+=(20-ri)/20+(12-bi)/24+(n.vote||0)/20;if(sc.from.length<2)sc.from.push(b.title)})}catch(e){}}));
    const recs=Object.values(score).sort((a,b)=>b.s-a.s).slice(0,48);
    for(const s of SAGAS)if(s.items.some(it=>{const n=S.cache[ckey(it)];return n&&S.watched[n.type+':'+n.id]}))await resolveSaga(s);
    const next=[];
    for(const s of SAGAS){const l=sagaList(s,S.order[s.id]||'crono',S.series[s.id]!==false);if(!l.some(isW))continue;const x=l.find(x=>x.n&&!isW(x));if(x)next.push({s,n:x.n})}
    recsCache={recs,next};
  }
  if(view!=='parati')return;
  const{recs,next}=recsCache;
  $('#recbody').innerHTML=(next.length?`<h3 style="font-size:28px;margin:18px 0 10px">Seguí tus sagas</h3><div class="hrow">${next.map(x=>card(x.n).replace('<div class="meta">',`<div class="meta"><small style="color:var(--acc2);font-weight:700">${esc(x.s.name)}</small>`)).join('')}</div>`:'')+
   `<h3 style="font-size:28px;margin:24px 0 10px">Te van a gustar</h3>${recs.length?`<div class="grid">${recs.map(r=>card(r.n).replace('</small></div></article>',`</small><small style="display:block">Porque viste ${esc(r.from[0])}</small></div></article>`)).join('')}</div>`:'<p class="empty">Todavía no tengo suficientes datos.</p>'}
   <button class="more" id="rerec">Actualizar recomendaciones</button>`;
  $('#rerec').onclick=()=>{recsCache=null;renderRecs()};
}

/* ---------- Mi lista ---------- */
const mine={tab:'vistas',type:'all',sort:'reciente'};
function renderMine(){
  const W=Object.entries(S.watched),A=Object.entries(S.want);
  const src=mine.tab==='vistas'?W:A;
  let l=src.map(([k,v])=>(REG[k]=Object.assign(REG[k]||{},v),v)).filter(v=>mine.type==='all'||v.type===mine.type);
  l.sort(mine.sort==='titulo'?(a,b)=>a.title.localeCompare(b.title):mine.sort==='anio'?(a,b)=>(b.year||'').localeCompare(a.year||''):(a,b)=>b.at-a.at);
  const nm=W.filter(([k])=>k.startsWith('movie')).length,nt=W.length-nm;
  app.innerHTML=`<h2 class="sec">Mi lista</h2>
  <div class="stats"><div class="stat"><b>${nm}</b>películas vistas</div><div class="stat"><b>${nt}</b>series vistas</div><div class="stat"><b>${A.length}</b>en “quiero ver”</div></div>
  <div class="tools"><div class="seg" id="mtab"><button data-v="vistas" aria-pressed="${mine.tab==='vistas'}">Vistas</button><button data-v="quiero" aria-pressed="${mine.tab==='quiero'}">Quiero ver</button></div>
  <div class="seg" id="mtype"><button data-v="all" aria-pressed="${mine.type==='all'}">Todo</button><button data-v="movie" aria-pressed="${mine.type==='movie'}">Pelis</button><button data-v="tv" aria-pressed="${mine.type==='tv'}">Series</button></div>
  <select id="msort" class="btn ghost"><option value="reciente">Agregadas recién</option><option value="titulo">Por título</option><option value="anio">Por año</option></select></div>
  ${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<p class="empty">${mine.tab==='vistas'?'Todavía no marcaste nada como visto. Tocá el ✓ de cualquier portada.':'Tu lista “quiero ver” está vacía. Abrí una peli y tocá “Quiero verla”.'}</p>`}
  <details class="box" style="margin-top:40px"><summary><b>Copia de seguridad</b> — llevá tu lista a otro navegador</summary>
   <p class="muted">Descargá tu lista y cargala en otro navegador o computadora.</p>
   <div class="acts"><button class="btn" id="exp">Descargar copia</button><label class="btn ghost">Cargar copia<input type="file" id="imp" accept=".json" hidden></label></div></details>`;
  $('#msort').value=mine.sort;
  $('#mtab').onclick=e=>{if(e.target.dataset.v){mine.tab=e.target.dataset.v;renderMine()}};
  $('#mtype').onclick=e=>{if(e.target.dataset.v){mine.type=e.target.dataset.v;renderMine()}};
  $('#msort').onchange=e=>{mine.sort=e.target.value;renderMine()};
  $('#exp').onclick=()=>{const b=new Blob([JSON.stringify({watched:S.watched,want:S.want,order:S.order,series:S.series},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='micine-lista.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());Object.assign(S.watched,d.watched||{});Object.assign(S.want,d.want||{});Object.assign(S.order,d.order||{});Object.assign(S.series,d.series||{});recsCache=null;save();toast('Lista cargada');renderMine()}catch(er){toast('Ese archivo no es una copia válida')}};
}

/* ===================== DETALLE ===================== */
let openKey=null;
async function openDetail(k,silent){
  const n=REG[k];if(!n)return;openKey=k;
  const m=$('#modal'),sh=$('#sheet');
  if(!silent){m.classList.add('open');document.body.style.overflow='hidden';sh.innerHTML=`<button class="close" data-close>✕</button><div class="hero"></div><p class="spin">Cargando…</p>`}
  let d=n._d;
  if(!d){try{d=await api(`${n.type}/${n.id}`,{append_to_response:'credits,recommendations,watch/providers'});n._d=d}catch(e){sh.innerHTML=`<button class="close" data-close>✕</button><p class="err" style="padding:30px">${esc(e.message)}</p>`;return}}
  if(openKey!==k)return;
  const w=S.watched[k],wa=S.want[k];
  const dur=n.type==='movie'?(d.runtime?`${Math.floor(d.runtime/60)} h ${d.runtime%60} min`:''):`${d.number_of_seasons||'?'} temporada${d.number_of_seasons===1?'':'s'}`;
  const pv=(d['watch/providers']?.results||{})[S.region]||{};
  const provs=[...(pv.flatrate||[]),...(pv.free||[]),...(pv.ads||[])];
  const rent=[...(pv.rent||[]),...(pv.buy||[])].filter((p,i,a)=>a.findIndex(q=>q.provider_id===p.provider_id)===i);
  const recs=(d.recommendations?.results||[]).slice(0,14).map(r=>norm(r,n.type));
  const cast=(d.credits?.cast||[]).slice(0,10);
  const crew=(d.credits?.crew||[]).filter(c=>c.job==='Director').map(c=>c.name);
  const creators=(d.created_by||[]).map(c=>c.name);
  sh.innerHTML=`<button class="close" data-close aria-label="Cerrar">✕</button>
  <div class="hero" style="background-image:url('${img(d.backdrop_path,'w1280')}')"></div>
  <div class="dbody"><div><div class="poster" style="cursor:default">${n.poster?`<img src="${img(n.poster,'w500')}" alt="">`:`<span>${esc(n.title)}</span>`}</div></div>
  <div><h2>${esc(d.title||d.name)}</h2>
   ${(d.original_title||d.original_name)!==(d.title||d.name)?`<div class="muted">${esc(d.original_title||d.original_name)}</div>`:''}
   <div class="facts">${[n.year,n.type==='tv'?'Serie':'Película',dur,(d.genres||[]).map(g=>g.name).join(', '),d.vote_average?`★ ${d.vote_average.toFixed(1)}`:''].filter(Boolean).map(esc).join(' · ')}</div>
   <div class="acts"><button class="btn${w?' on':''}" data-tick="${k}">${w?'✓ Ya la vi':'Marcar como vista'}</button>
   ${w?'':`<button class="btn ghost" data-want="${k}">${wa?'★ En “quiero ver”':'+ Quiero verla'}</button>`}
   ${d.belongs_to_collection?`<button class="btn ghost" data-col="${d.belongs_to_collection.id}">Ver saga: ${esc(d.belongs_to_collection.name)}</button>`:''}</div>
   <p>${esc(d.overview||'Sin sinopsis en español todavía.')}</p>
   ${crew.length?`<p><b>Dirección:</b> ${esc(crew.join(', '))}</p>`:''}${creators.length?`<p><b>Creada por:</b> ${esc(creators.join(', '))}</p>`:''}
   ${d.tagline?`<p class="muted"><i>${esc(d.tagline)}</i></p>`:''}
  </div>
  <div class="full"><h3 style="font-size:24px;margin-bottom:8px">Dónde verla en ${esc(S.region)}</h3>
   ${provs.length?`<div class="provs">${provs.map(p=>`<img src="${img(p.logo_path,'w92')}" alt="${esc(p.provider_name)}" title="${esc(p.provider_name)}">`).join('')}</div>`:'<p class="muted">No figura en plataformas de suscripción.</p>'}
   ${rent.length?`<p class="muted" style="margin-top:8px">Alquiler o compra: ${esc(rent.map(p=>p.provider_name).join(', '))}</p>`:''}
   ${pv.link?`<p><a href="${esc(pv.link)}" target="_blank" rel="noopener">Ver opciones en TMDB / JustWatch</a></p>`:''}</div>
  ${cast.length?`<div class="full"><h3 style="font-size:24px;margin-bottom:8px">Reparto</h3><div class="cast">${cast.map(c=>`<span>${esc(c.name)}${c.character?` <small class="muted">· ${esc(c.character)}</small>`:''}</span>`).join('')}</div></div>`:''}
  ${recs.length?`<div class="full"><h3 style="font-size:24px;margin-bottom:8px">Si te gustó, mirá</h3><div class="hrow">${recs.map(card).join('')}</div></div>`:''}
  </div>`;
}
function closeDetail(){openKey=null;$('#modal').classList.remove('open');document.body.style.overflow=''}

/* ===================== AJUSTES ===================== */
function openSettings(){
  openKey=null;$('#modal').classList.add('open');document.body.style.overflow='hidden';
  const regs=[['AR','Argentina'],['UY','Uruguay'],['CL','Chile'],['MX','México'],['ES','España'],['CO','Colombia'],['PE','Perú'],['US','Estados Unidos']];
  $('#sheet').innerHTML=`<button class="close" data-close>✕</button><div style="padding:28px"><h2 class="sec">Ajustes</h2>
  <form id="setf"><p><b>Clave de TMDB</b></p><div class="field"><input id="sk" value="${esc(S.key)}" autocomplete="off"></div>
  <p><b>País</b> <span class="muted">(para “dónde verla” y estrenos)</span></p><select id="sr" class="btn ghost">${regs.map(r=>`<option value="${r[0]}" ${S.region===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select>
  <p><b>Idioma de títulos y sinopsis</b></p><select id="sl" class="btn ghost"><option value="es-MX">Español latino</option><option value="es-ES">Español de España</option><option value="en-US">Inglés</option></select>
  <div class="acts" style="margin-top:20px"><button class="btn">Guardar</button><button type="button" class="btn ghost" id="wipe">Borrar caché de sagas</button></div><p class="err" id="serr"></p></form></div>`;
  $('#sl').value=S.lang;
  $('#setf').onsubmit=async e=>{e.preventDefault();const k=$('#sk').value.trim();
    try{if(k!==S.key)await api('configuration',{},k);S.key=k;
      if(S.lang!==$('#sl').value){S.cache={};ex.items=[];genres={}}
      S.region=$('#sr').value;S.lang=$('#sl').value;recsCache=null;for(const x in REG)delete REG[x]._d;save();closeDetail();app.innerHTML='';route();toast('Ajustes guardados')}catch(er){$('#serr').textContent=er.message}};
  $('#wipe').onclick=()=>{S.cache={};save();toast('Caché borrada')};
}

/* ===================== EVENTOS ===================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tick],[data-open],[data-want],[data-saga],[data-col],[data-go],[data-close],#nav button,#gear');
  if(!t){if(e.target.id==='modal')closeDetail();return}
  if(t.dataset.tick){e.preventDefault();toggleWatched(t.dataset.tick)}
  else if(t.dataset.want){toggleWant(t.dataset.want)}
  else if(t.dataset.open){openDetail(t.dataset.open)}
  else if(t.dataset.saga){go('saga-'+t.dataset.saga)}
  else if(t.dataset.col){closeDetail();go('saga-col'+t.dataset.col)}
  else if(t.dataset.go){go(t.dataset.go)}
  else if(t.dataset.close!==undefined){closeDetail()}
  else if(t.id==='gear'){openSettings()}
  else if(t.dataset.view){go(t.dataset.view)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('open'))closeDetail()});
addEventListener('hashchange',()=>{app.innerHTML='';route();scrollTo(0,0)});
route();
}
</script>
</body>
</html>
